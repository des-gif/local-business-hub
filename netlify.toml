[build]
  publish = "src"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[dev]
  publish = "src"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"
  port = 8888

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Canonical host is shop.webbcareconsultancy.com.
# Any request to the Netlify subdomain is 301'd to the primary domain,
# preserving the path + query.
[[redirects]]
  from = "https://localbusinessai.netlify.app/*"
  to = "https://shop.webbcareconsultancy.com/:splat"
  status = 301
  force = true
